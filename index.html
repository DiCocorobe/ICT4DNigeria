<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria Conflict Analysis Instrument</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f8f9fa;
            --text-light: #212529;
            --panel-light: #ffffff;
            --border-light: #dee2e6;
            
            --bg-dark: #1a1d20;
            --text-dark: #e9ecef;
            --panel-dark: #2c3034;
            --border-dark: #495057;
            
            --primary: #007bff;
            --nw-color: #28a745;
            --ne-color: #dc3545;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-mode { background-color: var(--bg-light); color: var(--text-light); }
        body.dark-mode { background-color: var(--bg-dark); color: var(--text-dark); }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 350px;
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .light-mode #sidebar { background-color: var(--panel-light); border-right: 1px solid var(--border-light); }
        .dark-mode #sidebar { background-color: var(--panel-dark); border-right: 1px solid var(--border-dark); }

        /* Map Styling */
        #map {
            flex-grow: 1;
            height: 100%;
        }

        /* UI Elements */
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .description { font-size: 0.85rem; opacity: 0.8; margin-bottom: 1.5rem; }
        
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        
        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: transparent;
            color: inherit;
        }

        .stats-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-box.nw { background-color: rgba(40, 167, 69, 0.15); border: 1px solid var(--nw-color); }
        .stats-box.ne { background-color: rgba(220, 53, 69, 0.15); border: 1px solid var(--ne-color); }
        .stats-val { font-size: 1.2rem; font-weight: 600; }
        .stats-label { font-size: 0.8rem; }

        .legend {
            font-size: 0.8rem;
            line-height: 1.5;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .legend i { width: 12px; height: 12px; float: left; margin-right: 8px; border-radius: 50%; }

        .toggle-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            font-weight: 600;
        }

        .comparison-panel {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #888;
        }
    </style>
</head>
<body class="light-mode">
    <div id="app">
        <div id="sidebar">
            <h1>Nigeria Conflict Map</h1>
            <div id="loadingStatus" style="color: var(--primary); font-weight: bold; margin-bottom: 1rem;">Loading Data...</div>
            <p class="description">Interactive instrument for North West & North East regional analysis (2000-Present).</p>
            
            <button id="themeToggle" class="toggle-btn">Switch to Dark Mode</button>

            <div class="comparison-panel">
                <label>Regional Comparison (Live Data)</label>
                <div class="stats-box nw">
                    <div>
                        <div class="stats-label">NORTH WEST</div>
                        <div id="nw-count" class="stats-val">0</div>
                    </div>
                    <div class="stats-label">Total Events</div>
                </div>
                <div class="stats-box ne">
                    <div>
                        <div class="stats-label">NORTH EAST</div>
                        <div id="ne-count" class="stats-val">0</div>
                    </div>
                    <div class="stats-label">Total Events</div>
                </div>
            </div>

            <div class="filter-group">
                <label for="typeFilter">Conflict Type</label>
                <select id="typeFilter">
                    <option value="all">All Types</option>
                    <option value="State-based conflict">State-based conflict</option>
                    <option value="Non-state conflict">Non-state conflict</option>
                    <option value="One-sided violence">One-sided violence</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="stateFilter">State (13 Regions)</label>
                <select id="stateFilter">
                    <option value="all">All States</option>
                    <optgroup label="North West">
                        <option value="Sokoto">Sokoto</option>
                        <option value="Kebbi">Kebbi</option>
                        <option value="Zamfara">Zamfara</option>
                        <option value="Katsina">Katsina</option>
                        <option value="Kano">Kano</option>
                        <option value="Jigawa">Jigawa</option>
                        <option value="Kaduna">Kaduna</option>
                    </optgroup>
                    <optgroup label="North East">
                        <option value="Yobe">Yobe</option>
                        <option value="Borno">Borno</option>
                        <option value="Bauchi">Bauchi</option>
                        <option value="Gombe">Gombe</option>
                        <option value="Adamawa">Adamawa</option>
                        <option value="Taraba">Taraba</option>
                    </optgroup>
                </select>
            </div>

            <div class="filter-group">
                <label>Year Range: <span id="yearVal">2000 - 2026</span></label>
                <input type="range" id="yearFilter" min="2000" max="2026" value="2000">
            </div>

            <div class="filter-group">
                <label for="fatalFilter">Minimum Fatalities</label>
                <select id="fatalFilter">
                    <option value="0">Show All</option>
                    <option value="1">1+ Deaths</option>
                    <option value="10">10+ Deaths</option>
                    <option value="50">50+ Deaths</option>
                    <option value="100">100+ Deaths</option>
                </select>
            </div>

            <div class="legend">
                <strong>Fatalities Intensity</strong><br>
                <i style="background: #ffffb2"></i> 0-1 Deaths<br>
                <i style="background: #fed976"></i> 2-10 Deaths<br>
                <i style="background: #feb24c"></i> 11-50 Deaths<br>
                <i style="background: #fd8d3c"></i> 51-100 Deaths<br>
                <i style="background: #e31a1c"></i> 100+ Deaths
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // Configuration
        const MAP_CENTER = [11.5, 10.0]; // Centered on North Nigeria
        const ZOOM_LEVEL = 6;
        
        let map, markerLayer, allData = [], currentMode = 'light';
        
        // Tile Layers
        const lightTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        });
        const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        });

        function initMap() {
            map = L.map('map').setView(MAP_CENTER, ZOOM_LEVEL);
            lightTiles.addTo(map);
            markerLayer = L.layerGroup().addTo(map);
        }

        function getColor(fatalities) {
            const f = parseInt(fatalities) || 0;
            return f > 100 ? '#e31a1c' :
                   f > 50  ? '#fd8d3c' :
                   f > 10  ? '#feb24c' :
                   f > 1   ? '#fed976' :
                             '#ffffb2';
        }

        function updateStats(filteredData) {
            const nw = filteredData.filter(d => d.Analysis_Region && d.Analysis_Region.trim() === 'North West').length;
            const ne = filteredData.filter(d => d.Analysis_Region && d.Analysis_Region.trim() === 'North East').length;
            document.getElementById('nw-count').innerText = nw.toLocaleString();
            document.getElementById('ne-count').innerText = ne.toLocaleString();
        }

        function applyFilters() {
            if (!allData || allData.length === 0) return;
            
            const type = document.getElementById('typeFilter').value;
            const state = document.getElementById('stateFilter').value;
            const year = parseInt(document.getElementById('yearFilter').value);
            const minFatal = parseInt(document.getElementById('fatalFilter').value);
            
            document.getElementById('yearVal').innerText = `${year} - 2026`;

            markerLayer.clearLayers();
            
            const filtered = allData.filter(d => {
                if (!d || !d.year || !d.adm_1) return false;
                
                const matchType = type === 'all' || d.official_conflict_type === type;
                const matchState = state === 'all' || d.adm_1.toLowerCase().includes(state.toLowerCase());
                const matchYear = parseInt(d.year) >= year;
                const matchFatal = (parseInt(d.best) || 0) >= minFatal;
                return matchType && matchState && matchYear && matchFatal;
            });

            console.log(`Filtered data: ${filtered.length} points found.`);

            filtered.forEach(d => {
                const lat = parseFloat(d.latitude);
                const lon = parseFloat(d.longitude);
                if (!isNaN(lat) && !isNaN(lon)) {
                    L.circleMarker([lat, lon], {
                        radius: 6,
                        fillColor: getColor(d.best),
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    })
                    .bindPopup(`
                        <strong>${d.conflict_name || 'Conflict'}</strong><br>
                        Type: ${d.official_conflict_type}<br>
                        Location: ${d.adm_1}, ${d.adm_2}<br>
                        Date: ${d.date_start ? d.date_start.split(' ')[0] : 'N/A'}<br>
                        Fatalities: ${d.best || 0}
                    `)
                    .addTo(markerLayer);
                }
            });

            updateStats(filtered);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            
            const loadingStatus = document.getElementById('loadingStatus');
            console.log("Loading CSV data via fetch...");
            
            fetch('./filtered_conflict_data.csv')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(csvText => {
                    console.log("CSV text received, parsing...");
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            allData = results.data;
                            loadingStatus.style.display = 'none';
                            console.log(`Data parsed. Total rows: ${allData.length}`);
                            applyFilters();
                        },
                        error: function(err) {
                            console.error("Parsing error:", err);
                            loadingStatus.innerText = "Error parsing data.";
                        }
                    });
                })
                .catch(err => {
                    console.error("Fetch error:", err);
                    loadingStatus.innerText = "Error: Could not find data file.";
                    alert("Failed to load conflict data. Please ensure 'filtered_conflict_data.csv' is in the repository.");
                });

            // Event Listeners
            document.getElementById('typeFilter').addEventListener('change', applyFilters);
            document.getElementById('stateFilter').addEventListener('change', applyFilters);
            document.getElementById('yearFilter').addEventListener('input', applyFilters);
            document.getElementById('fatalFilter').addEventListener('change', applyFilters);

            document.getElementById('themeToggle').addEventListener('click', () => {
                const body = document.body;
                if (currentMode === 'light') {
                    body.classList.replace('light-mode', 'dark-mode');
                    map.removeLayer(lightTiles);
                    darkTiles.addTo(map);
                    document.getElementById('themeToggle').innerText = 'Switch to Day Mode';
                    currentMode = 'dark';
                } else {
                    body.classList.replace('dark-mode', 'light-mode');
                    map.removeLayer(darkTiles);
                    lightTiles.addTo(map);
                    document.getElementById('themeToggle').innerText = 'Switch to Night Mode';
                    currentMode = 'light';
                }
            });
        });
    </script>
</body>
</html>
