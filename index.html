<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigeria Conflict Analysis Dashboard</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #0f172a;
            --panel: #ffffff;
            --border: #e2e8f0;
            --nw: #10b981;
            --ne: #ef4444;
        }

        .dark {
            --bg: #0f172a;
            --text: #f8fafc;
            --panel: #1e293b;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; transition: 0.3s; }
        #root { display: flex; height: 100vh; width: 100vw; }

        .sidebar { width: 400px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; overflow-y: auto; z-index: 1000; }
        .header { margin-bottom: 24px; }
        .header h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; }
        .header p { font-size: 0.875rem; opacity: 0.7; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .stat-card { padding: 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); }
        .stat-card.nw { border-left: 4px solid var(--nw); }
        .stat-card.ne { border-left: 4px solid var(--ne); }
        .stat-label { font-size: 0.75rem; font-weight: 600; opacity: 0.6; margin-bottom: 4px; }
        .stat-value { font-size: 1.25rem; font-weight: 700; }

        .filter-section { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 0.875rem; font-weight: 600; }
        select, input[type="range"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 0.875rem; }

        #map { flex-grow: 1; height: 100%; background: #aad3df; }
        
        .controls { display: flex; gap: 8px; margin-bottom: 24px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; border: none; }

        #error-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
            display: none;
            max-height: 100px;
            overflow-y: auto;
        }

        .loading-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        
        @media (max-width: 768px) {
            #root { flex-direction: column; }
            .sidebar { width: 100%; height: 50vh; }
            #map { height: 50vh; }
        }
    </style>
</head>
<body class="light">
    <div id="error-console"></div>
    <div id="loading-screen" class="loading-screen">
        <div style="font-weight: 600; margin-bottom: 10px;">Loading Dashboard Components...</div>
        <div id="loading-status" style="font-size: 0.8rem; opacity: 0.7;">Initializing React & Libraries</div>
    </div>
    
    <div id="root"></div>

    <!-- JS Dependencies -->
    <script>
        window.onerror = function(msg, url, line) {
            const console = document.getElementById('error-console');
            console.style.display = 'block';
            console.innerHTML += `<div>Error: ${msg} at ${line}</div>`;
        };
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        const REGIONS = {
            'North West': ['Sokoto', 'Kebbi', 'Zamfara', 'Katsina', 'Kano', 'Jigawa', 'Kaduna'],
            'North East': ['Yobe', 'Borno', 'Bauchi', 'Gombe', 'Adamawa', 'Taraba']
        };

        const getIntensityColor = (deaths) => {
            const d = parseInt(deaths) || 0;
            if (d > 100) return '#7f1d1d';
            if (d > 50) return '#ef4444';
            if (d > 10) return '#f97316';
            return '#fbbf24';
        };

        const MapContainer = ({ points, isDark }) => {
            const mapRef = useRef(null);
            const markerLayerRef = useRef(null);
            
            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { center: [11.5, 10.0], zoom: 6, zoomControl: false });
                    L.control.zoom({ position: 'topright' }).addTo(mapRef.current);
                    markerLayerRef.current = L.layerGroup().addTo(mapRef.current);
                }
            }, []);

            useEffect(() => {
                const tileUrl = isDark 
                    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
                const tiles = L.tileLayer(tileUrl, { attribution: '&copy; CARTO' }).addTo(mapRef.current);
                return () => mapRef.current.removeLayer(tiles);
            }, [isDark]);

            useEffect(() => {
                if (markerLayerRef.current) {
                    markerLayerRef.current.clearLayers();
                    points.forEach(p => {
                        const lat = parseFloat(p.latitude), lon = parseFloat(p.longitude);
                        if (!isNaN(lat) && !isNaN(lon)) {
                            L.circleMarker([lat, lon], {
                                radius: 6, fillColor: getIntensityColor(p.best), color: isDark ? "#fff" : "#000",
                                weight: 0.5, opacity: 1, fillOpacity: 0.8
                            })
                            .bindPopup(`
                                <div style="font-family: sans-serif;">
                                    <strong style="color: #2563eb">${p.conflict_name || 'Event'}</strong><br/>
                                    <b>Location:</b> ${p.adm_1}, ${p.adm_2}<br/>
                                    <b>Fatalities:</b> ${p.best || 0}
                                </div>
                            `)
                            .addTo(markerLayerRef.current);
                        }
                    });
                }
            }, [points, isDark]);

            return <div id="map"></div>;
        };

        const App = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isDark, setIsDark] = useState(false);
            const [filters, setFilters] = useState({ type: 'all', state: 'all', minYear: 2000 });

            useEffect(() => {
                document.getElementById('loading-status').innerText = "Downloading Conflict Data (3.5MB)...";
                Papa.parse('filtered_conflict_data.csv', {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (results) => {
                        setData(results.data.filter(d => d.latitude && d.longitude));
                        setLoading(false);
                        document.getElementById('loading-screen').style.display = 'none';
                    }
                });
            }, []);

            const filteredData = useMemo(() => {
                return data.filter(d => {
                    const matchType = filters.type === 'all' || d.official_conflict_type === filters.type;
                    const matchState = filters.state === 'all' || d.adm_1.toLowerCase().includes(filters.state.toLowerCase());
                    const matchYear = parseInt(d.year) >= filters.minYear;
                    return matchType && matchState && matchYear;
                });
            }, [data, filters]);

            const chartData = useMemo(() => {
                const counts = {};
                filteredData.forEach(d => { counts[d.year] = (counts[d.year] || 0) + 1; });
                return Object.keys(counts).sort().map(year => ({ year, events: counts[year] }));
            }, [filteredData]);

            const nwCount = filteredData.filter(d => d.Analysis_Region === 'North West').length;
            const neCount = filteredData.filter(d => d.Analysis_Region === 'North East').length;

            useEffect(() => { document.body.className = isDark ? 'dark' : 'light'; }, [isDark]);

            return (
                <div id="root">
                    <div className="sidebar">
                        <div className="header">
                            <h1>Nigeria Conflict Map</h1>
                            <p>North West & North East analysis (2000-2024)</p>
                        </div>
                        <div className="controls">
                            <button className="btn" onClick={() => setIsDark(!isDark)}>{isDark ? '☀️ Light' : '🌙 Dark'}</button>
                            <button className="btn btn-primary" onClick={() => window.open('https://github.com/dicocorobe/ICT4DNigeria')}>📁 Repo</button>
                        </div>
                        <div className="stats-grid">
                            <div className="stat-card nw"><div className="stat-label">North West</div><div className="stat-value">{nwCount}</div></div>
                            <div className="stat-card ne"><div className="stat-label">North East</div><div className="stat-value">{neCount}</div></div>
                        </div>
                        <div className="filter-section">
                            <div className="filter-group">
                                <label>Conflict Type</label>
                                <select onChange={e => setFilters({...filters, type: e.target.value})}>
                                    <option value="all">All Types</option>
                                    <option value="State-based conflict">State-based</option>
                                    <option value="Non-state conflict">Non-state</option>
                                    <option value="One-sided violence">One-sided</option>
                                </select>
                            </div>
                            <div className="filter-group">
                                <label>State</label>
                                <select onChange={e => setFilters({...filters, state: e.target.value})}>
                                    <option value="all">All States</option>
                                    {Object.values(REGIONS).flat().map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                            <div className="filter-group">
                                <label>From Year: {filters.minYear}</label>
                                <input type="range" min="2000" max="2024" value={filters.minYear} onChange={e => setFilters({...filters, minYear: parseInt(e.target.value)})} />
                            </div>
                        </div>
                        <div style={{ marginTop: 'auto', height: '150px' }}>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={chartData}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                    <XAxis dataKey="year" fontSize={10} />
                                    <Tooltip />
                                    <Bar dataKey="events" fill="#2563eb" />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                    <MapContainer points={filteredData} isDark={isDark} />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
